<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiến trúc hệ thống Social Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1040px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Kiến trúc · Social Flow v0.1.2</p>
    <h1>Kiến trúc hệ thống Social Flow</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1040 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">Kiến trúc hệ thống Social Flow</title>
        <desc id="architecture-desc">Sơ đồ kiến trúc Manifest V3 của Social Flow gồm popup điều khiển, service worker background.js, Chrome APIs/storage và các content script chạy trong tab.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones (drawn first, before arrows and nodes) -->
        <!-- Zone 1: Chrome APIs & Storage (eyebrow centered between vertical connectors at x=140 and x=376) -->
        <rect x="40" y="288" width="560" height="148" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="184" y="292" width="144" height="12" rx="2" fill="#f5f5f5"/>
        <text x="256" y="301" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.14em">CHROME APIS &amp; STORAGE</text>

        <!-- Zone 2: Tab Content Scripts -->
        <rect x="664" y="40" width="336" height="308" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="680" y="44" width="144" height="12" rx="2" fill="#f5f5f5"/>
        <text x="752" y="53" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.14em">TAB · CONTENT SCRIPTS</text>

        <!-- Arrows (drawn before nodes, all orthogonal, zero crossings) -->
        <!-- 1. Popup -> SW: SF_CONTROL (coral primary path) -->
        <line x1="240" y1="96" x2="344" y2="96" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- 2. Popup -> SW: SF_INSPECT (dashed 1s polling) -->
        <line x1="240" y1="140" x2="344" y2="140" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- 3. Popup -> storage.local -->
        <line x1="140" y1="168" x2="140" y2="332" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 4. SW -> content.js: SF_START / SF_STOP / SF_STATUS -->
        <line x1="560" y1="92" x2="712" y2="92" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- 5. content.js -> SW: SF_HELLO / SF_SAVE -->
        <line x1="712" y1="124" x2="560" y2="124" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- 6. SW -> storage.session -->
        <line x1="376" y1="168" x2="376" y2="332" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 7. SW -> tabs & scripting -->
        <line x1="504" y1="168" x2="504" y2="332" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- 8. tabs & scripting -> content.js (executeScript) -->
        <path d="M 584,376 H 628 Q 636,376 636,368 V 164 Q 636,156 644,156 H 712"
              fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- 9. content.js -> core.js -->
        <line x1="752" y1="168" x2="752" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 10. content.js -> facebook.js -->
        <line x1="912" y1="168" x2="912" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels (opaque paper mask, 8px gap from stroke, clear of nodes) -->
        <!-- 1. SF_CONTROL -->
        <rect x="260" y="76" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="292" y="85" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">SF_CONTROL</text>

        <!-- 2. SF_INSPECT -->
        <rect x="260" y="148" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="292" y="157" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">SF_INSPECT</text>

        <!-- 3. CONFIG -->
        <rect x="148" y="220" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="172" y="229" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">CONFIG</text>

        <!-- 4. SF_START/STOP -->
        <rect x="572" y="72" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="614" y="81" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">SF_START/STOP</text>

        <!-- 5. SF_HELLO/SAVE -->
        <rect x="572" y="132" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="614" y="141" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">SF_HELLO/SAVE</text>

        <!-- 6. SNAPSHOT -->
        <rect x="308" y="220" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="338" y="229" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">SNAPSHOT</text>

        <!-- 7. TABS / INJECT -->
        <rect x="512" y="200" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="554" y="209" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">TABS / INJECT</text>

        <!-- 8. EXECUTESCRIPT -->
        <rect x="544" y="248" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="586" y="257" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">EXECUTESCRIPT</text>

        <!-- 9. SESSION -->
        <rect x="688" y="200" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="716" y="209" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">SESSION</text>

        <!-- 10. DOM SCAN -->
        <rect x="920" y="200" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="948" y="209" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">DOM SCAN</text>

        <!-- Node 1: Popup UI (input) -->
        <rect x="40" y="72" width="200" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="72" width="200" height="96" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="80" width="36" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="66" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">POPUP</text>
        <text x="140" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">popup.html / popup.js</text>
        <text x="140" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">tabs.query · poll 1s · core</text>

        <!-- Node 2: Service Worker (focal coral) -->
        <rect x="344" y="72" width="216" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="344" y="72" width="216" height="96" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="352" y="80" width="44" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="374" y="89" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MV3 SW</text>
        <text x="452" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">background.js</text>
        <text x="452" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">serial · documentId · revision</text>

        <!-- Node 3: content.js (backend) -->
        <rect x="712" y="72" width="240" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="712" y="72" width="240" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="720" y="80" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="744" y="89" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CONTENT</text>
        <text x="832" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">content.js</text>
        <text x="832" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">tick · scrollBy · Shadow DOM</text>

        <!-- Node 4: core.js (backend) -->
        <rect x="680" y="248" width="144" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="680" y="248" width="144" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="688" y="256" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="704" y="265" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="752" y="290" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">core.js</text>
        <text x="752" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Session · max 5.000</text>

        <!-- Node 5: facebook.js (backend) -->
        <rect x="840" y="248" width="144" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="840" y="248" width="144" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="848" y="256" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="862" y="265" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DOM</text>
        <text x="912" y="290" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">facebook.js</text>
        <text x="912" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">collect · actionFor</text>

        <!-- Node 6: storage.local (store) -->
        <rect x="60" y="332" width="160" height="84" rx="6" fill="#f5f5f5"/>
        <rect x="60" y="332" width="160" height="84" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="68" y="340" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="86" y="349" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">LOCAL</text>
        <text x="140" y="376" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">storage.local</text>
        <text x="140" y="394" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">socialFlowConfig</text>

        <!-- Node 7: storage.session (store) -->
        <rect x="240" y="332" width="160" height="84" rx="6" fill="#f5f5f5"/>
        <rect x="240" y="332" width="160" height="84" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="248" y="340" width="44" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="270" y="349" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SESSION</text>
        <text x="320" y="376" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">storage.session</text>
        <text x="320" y="394" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">social-flow:tabId</text>

        <!-- Node 8: tabs & scripting (external) -->
        <rect x="424" y="332" width="160" height="84" rx="6" fill="#f5f5f5"/>
        <rect x="424" y="332" width="160" height="84" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="432" y="340" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="452" y="349" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CHROME</text>
        <text x="504" y="376" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">tabs &amp; scripting</text>
        <text x="504" y="394" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">activeTab · onUpdated</text>

        <!-- Legend strip -->
        <line x1="40" y1="456" x2="1000" y2="456" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="472" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

        <rect x="40" y="488" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="60" y="496" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">MV3 SW</text>

        <rect x="120" y="488" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

        <rect x="312" y="488" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="332" y="496" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Chrome API</text>

    </div>
  </div>
</body>
</html>
