<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vòng đời phiên và chu kỳ quét, like, cuộn</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1040px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Vòng đời phiên · Social Flow v0.1.2</p>
    <h1>Vòng đời phiên và chu kỳ quét, like, cuộn</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1040 656" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="session-tick-lifecycle-title session-tick-lifecycle-desc">
        <title id="session-tick-lifecycle-title">Vòng đời phiên và chu kỳ quét, like, cuộn</title>
        <desc id="session-tick-lifecycle-desc">Lưu đồ điều khiển phiên Social Flow từ bắt đầu, khôi phục tải lại, lọc bài mỗi lượt tick, xác nhận like, tiếp tục cuộn khi hết hạn mức đến khi dừng.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows (drawn before nodes, strictly orthogonal, zero crossings) -->
        <!-- 1. Start -> Scan & Filter (36px gap) -->
        <line x1="312" y1="92" x2="312" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 2. Reload recovery -> Scan & Filter -->
        <line x1="520" y1="160" x2="432" y2="160" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
        <!-- 3. Scan & Filter -> Diamond 1 (36px gap) -->
        <line x1="312" y1="192" x2="312" y2="228" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 4. Diamond 1 -> Save & Recheck (coral primary like path) -->
        <line x1="432" y1="276" x2="520" y2="276" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- 5. Save & Recheck -> Click & Confirm -->
        <line x1="728" y1="276" x2="792" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 6. Diamond 1 -> Scroll & Save (skip / non-FB / limit reached) -->
        <line x1="312" y1="324" x2="312" y2="372" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 7. Save & Recheck -> Scroll & Save (save fail or recycled DOM) -->
        <path d="M 624,308 V 380 Q 624,388 616,388 H 432"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- 8. Click & Confirm -> Scroll & Save (after 1300ms confirm) -->
        <path d="M 896,308 V 408 Q 896,416 888,416 H 432"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 9. Scroll & Save -> Diamond 2 (36px gap) -->
        <line x1="312" y1="436" x2="312" y2="472" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 10. Diamond 2 -> Stop Oval -->
        <line x1="432" y1="520" x2="520" y2="520" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 11. Diamond 2 -> Scan & Filter (continue scrolling loop) -->
        <path d="M 192,520 H 88 Q 80,520 80,512 V 168 Q 80,160 88,160 H 192"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels (opaque paper mask, 8px gap from strokes, clear of nodes) -->
        <!-- 2. SF_HELLO -->
        <rect x="448" y="140" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="476" y="149" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">SF_HELLO</text>

        <!-- 4. CÓ -->
        <rect x="460" y="256" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="476" y="265" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">CÓ</text>

        <!-- 5. KHỚP -->
        <rect x="740" y="256" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="760" y="265" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">KHỚP</text>

        <!-- 6. KHÔNG / HẾT -->
        <rect x="320" y="340" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="358" y="349" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">KHÔNG / HẾT</text>

        <!-- 7. BỎ QUA -->
        <rect x="500" y="368" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="524" y="377" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">BỎ QUA</text>

        <!-- 8. XONG LIKE -->
        <rect x="640" y="424" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="672" y="433" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">XONG LIKE</text>

        <!-- 10. DỪNG -->
        <rect x="456" y="500" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="476" y="509" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">DỪNG</text>

        <!-- 11. TIẾP TỤC CUỘN -->
        <rect x="88" y="340" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="130" y="349" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">TIẾP TỤC CUỘN</text>

        <!-- Node 1: Start oval -->
        <rect x="192" y="40" width="240" height="52" rx="20" fill="#f5f5f5"/>
        <rect x="192" y="40" width="240" height="52" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="312" y="62" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Bắt đầu · SF_START</text>
        <text x="312" y="78" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">executeScript · SF_HELLO</text>

        <!-- Node 2: Reload recovery entry oval -->
        <rect x="520" y="132" width="240" height="56" rx="20" fill="#f5f5f5"/>
        <rect x="520" y="132" width="240" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="640" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Tải lại tab · onUpdated</text>
        <text x="640" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">cùng origin · activeTab còn</text>

        <!-- Node 3: Scan & Filter step -->
        <rect x="192" y="128" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="192" y="128" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="312" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Quét &amp; lọc bài mỗi tick</text>
        <text x="312" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">fb.collect · inView · consider</text>

        <!-- Node 4: Decision Diamond 1 (coral focal) -->
        <polygon points="312,228 432,276 312,324 192,276" fill="#f5f5f5"/>
        <polygon points="312,228 432,276 312,324 192,276" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="312" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Bài thứ N hợp lệ</text>
        <text x="312" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">và &lt; maxLikes?</text>

        <!-- Node 5: Persist attempt & recheck DOM -->
        <rect x="520" y="244" width="208" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="520" y="244" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="624" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Lưu &amp; kiểm tra lại DOM</text>
        <text x="624" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">attempted · SF_SAVE · recheck</text>

        <!-- Node 6: Click Like & confirm -->
        <rect x="792" y="244" width="208" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="792" y="244" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="896" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Click Like &amp; xác nhận</text>
        <text x="896" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">wait 1300ms · isLiked · 1/tick</text>

        <!-- Node 7: Scroll & persist tick -->
        <rect x="192" y="372" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="192" y="372" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="312" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Cuộn trang &amp; lưu trạng thái</text>
        <text x="312" y="418" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">scrollBy · Shadow DOM · SF_SAVE</text>

        <!-- Node 8: Decision Diamond 2 -->
        <polygon points="312,472 432,520 312,568 192,520" fill="#f5f5f5"/>
        <polygon points="312,472 432,520 312,568 192,520" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="312" y="516" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Phiên vẫn chạy</text>
        <text x="312" y="532" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">(running = true)?</text>

        <!-- Node 9: Stop / End oval -->
        <rect x="520" y="492" width="240" height="56" rx="20" fill="#f5f5f5"/>
        <rect x="520" y="492" width="240" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="640" y="516" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Dừng · Kết thúc phiên</text>
        <text x="640" y="532" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SF_STOP · đóng tab · khác origin</text>

        <!-- Legend strip -->
        <line x1="40" y1="592" x2="1000" y2="592" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="608" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">CHÚ GIẢI · HÌNH DẠNG BIỂU THỊ VAI TRÒ</text>

        <rect x="40" y="624" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="72" y="633" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Bắt đầu / dừng (oval)</text>

        <rect x="212" y="624" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="244" y="633" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Bước xử lý</text>

        <polygon points="344,630 356,624 368,630 356,636" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="376" y="633" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Quyết định</text>

        <line x1="468" y1="630" x2="496" y2="630" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="504" y="633" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Nhánh thử like</text>

        <line x1="620" y1="630" x2="648" y2="630" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
        <text x="656" y="633" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Khôi phục tải lại</text>

        <line x1="784" y1="630" x2="812" y2="630" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="820" y="633" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Bỏ qua khi DOM đổi</text>
      </svg>
    </div>
  </div>
</body>
</html>
